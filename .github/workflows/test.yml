name: Backend CI

on:
  push:
    branches: [ main, test-init ]
  pull_request:
    branches: [ main, test-init ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Run Jest Unit Tests
        run: yarn test:unit

      - name: Spin up Docker Compose Stack
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Wait for Backend Service to be Healthy
        run: npx wait-on --timeout 60000 http://localhost:8001/api

      - name: Compile Seed Script
        run: ./node_modules/.bin/tsc --project tsconfig.seed.json

      - name: Seed Database
        run: node dist/tests/setup/seed.js
        env:
          MONGODB_URI: mongodb://localhost:27017/andhra-potlam
          NODE_ENV: test

      - name: Run Playwright API Integration Tests
        run: yarn test:integration
        env:
          TEST_API_URL: http://localhost:8001/api/

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Clean up Docker Containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: test
    # Only publish images on direct pushes to main — not on PRs or test-init
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/andhrapotlam/ap-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    # Only deploy on pushes to main, never on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # "production" is a GitHub Environment — add protection rules there
    # (e.g. require manual approval before auto-deploying to production)
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # command_timeout must be longer than the full deploy + smoke test cycle
          command_timeout: 10m
          script: |
            set -e
            cd ${{ secrets.INFRA_PATH }}

            # Pull latest infra repo changes (fast-forward only — never auto-merge)
            git pull --ff-only origin main

            # Use the short SHA (7 chars) to match the tag pushed by docker/metadata-action
            TAG=$(echo "${{ github.sha }}" | cut -c1-7) ./scripts/deploy.sh production backend

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Production deployment FAILED for commit ${{ github.sha }}"
          echo "Investigate: ssh into VPS and run: docker compose logs --tail=50 backend"
