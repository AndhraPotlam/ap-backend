name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Run Jest Unit Tests
        run: yarn test:unit

      - name: Spin up Docker Compose Stack
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Wait for Backend Service to be Healthy
        run: npx wait-on --timeout 60000 http://localhost:8001/api

      - name: Seed Database
        run: |
          yarn ts-node --project tsconfig.json -O '{"rootDir": "."}' tests/setup/seed.ts
        env:
          MONGODB_URI: mongodb://localhost:27017/andhra-potlam
          NODE_ENV: test

      - name: Run Playwright API Integration Tests
        run: yarn test:integration
        env:
          TEST_API_URL: http://localhost:8001/api/

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Clean up Docker Containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
