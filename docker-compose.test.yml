version: "3.8"

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: andhra_potlam_test
    ports:
      - "${TEST_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d andhra_potlam_test"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "${TEST_BACKEND_PORT:-8001}:8000"
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://test_user:test_password@postgres-test:5432/andhra_potlam_test?schema=public
      - PORT=8000
      - JWT_SECRET=test-secret-key-for-jwt-signing-minimum-32-characters
      - COOKIE_SECRET=test-cookie-secret
      - AWS_ACCESS_KEY_ID=mock-key
      - AWS_SECRET_ACCESS_KEY=mock-secret-key
      - AWS_BUCKET_NAME=mock-bucket
      - AWS_REGION=ap-south-1
      - SMTP_HOST=smtp.mailtrap.io
      - SMTP_PORT=2525
      - SMTP_USER=mock-user
      - SMTP_PASS=mock-pass
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/api || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
