version: "3.8"

services:
  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
    restart: always

  # (Optional) If you want a separate Nginx for backend API only
  # nginx-backend:
  #   image: nginx:latest
  #   container_name: ap-backend-nginx
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - backend-prod